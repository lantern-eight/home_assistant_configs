# =============================================================================
# General Home Mobile — HA Package
# =============================================================================
# Synced to HA as: packages/general_home_mobile.yaml
# Requires HA restart after changes (packages can't hot-reload).
#
# Loaded automatically — configuration.yaml loads the whole packages directory.
# This file is the `general_home_mobile` package. Dashboard-specific config
# only. General house-wide config goes in repo-root packages/general.yaml.
#
# `initial:` not included on values that persist across restarts.
#
# Categories and labels are defined in registry_metadata.yaml and
# applied by the sync script via WebSocket (-c flag).
# =============================================================================

# --- Conditional card time windows ---

schedule:
  cond_bedtime_doors:
    name: "Conditional: Bedtime Doors"
    icon: mdi:door-open
    monday: &bedtime_doors_active_window
      - from: "00:00:00"
        to: "07:00:00"
      - from: "19:30:00"
        to: "23:59:59"
    tuesday: *bedtime_doors_active_window
    wednesday: *bedtime_doors_active_window
    thursday: *bedtime_doors_active_window
    friday: *bedtime_doors_active_window
    saturday: *bedtime_doors_active_window
    sunday: *bedtime_doors_active_window
  cond_uv_index:
    name: "Conditional: UV Index"
    icon: mdi:weather-sunny-alert
    monday: &uv_index_active_window
      - from: "07:00:00"
        to: "17:00:00"
    tuesday: *uv_index_active_window
    wednesday: *uv_index_active_window
    thursday: *uv_index_active_window
    friday: *uv_index_active_window
    saturday: *uv_index_active_window
    sunday: *uv_index_active_window

# --- Notification state ---

input_boolean:
  notification_expanded_<entity_32>:
    name: "Notification Tray Expanded (<entity_32>)"
    icon: mdi:chevron-down
  notification_expanded_<entity_31>:
    name: "Notification Tray Expanded (<entity_31>)"
    icon: mdi:chevron-down

# --- Theme system ---

input_select:
  # --- Mulit-user model: one helper set per HA account (username-suffixed). ---
  # Mode picks which variant of the user's palette renders; System follows the
  # device's light/dark setting.
  theme_mode_<entity_32>:
    name: "Theme Mode (<entity_32>)"
    options:
      - Light
      - Dark
      - System
    icon: mdi:theme-light-dark
  theme_mode_<entity_31>:
    name: "Theme Mode (<entity_31>)"
    options:
      - Light
      - Dark
      - System
    icon: mdi:theme-light-dark
  theme_style_<entity_32>:
    name: "Theme Style (<entity_32>)"
    options:
      - Clean
      - Glass
      - Dark
      - Glow
      - Neon
    icon: mdi:palette-swatch-variant
  theme_style_<entity_31>:
    name: "Theme Style (<entity_31>)"
    options:
      - Clean
      - Glass
      - Dark
      - Glow
      - Neon
    icon: mdi:palette-swatch-variant
  theme_palette_<entity_32>:
    name: "Theme Palette (<entity_32>)"
    options:
      - Indigo
      - Ocean
      - Sunset
      - Forest
      - Rose
      - Mono
      - Cyberdeck
      - Mint
    icon: mdi:palette
  theme_palette_<entity_31>:
    name: "Theme Palette (<entity_31>)"
    options:
      - Indigo
      - Ocean
      - Sunset
      - Forest
      - Rose
      - Mono
      - Cyberdeck
      - Mint
    icon: mdi:palette

  # Severity color mode: "Standard" uses fixed, universally recognizable
  # red/amber/blue/green for status indicators regardless of palette.
  # "Match Palette" tints severity colors to match the active palette's
  # aesthetic, trading universal recognition for visual cohesion.
  theme_severity_colors_<entity_32>:
    name: "Severity Colors (<entity_32>)"
    options:
      - Standard
      - Match Palette
      - Match Identity
    icon: mdi:alert-circle-outline
  theme_severity_colors_<entity_31>:
    name: "Severity Colors (<entity_31>)"
    options:
      - Standard
      - Match Palette
      - Match Identity
    icon: mdi:alert-circle-outline

input_text:
  theme_background_<entity_32>:
    name: "Theme Background (<entity_32>)"
    max: 255
    icon: mdi:image
  theme_background_<entity_31>:
    name: "Theme Background (<entity_31>)"
    max: 255
    icon: mdi:image

input_number:
  theme_card_opacity_<entity_32>:
    name: "theme_card_opacity_<entity_32>"
    min: -1
    max: 100
    step: 5
    icon: mdi:opacity
    unit_of_measurement: "%"
    mode: slider
  theme_card_opacity_<entity_31>:
    name: "theme_card_opacity_<entity_31>"
    min: -1
    max: 100
    step: 5
    icon: mdi:opacity
    unit_of_measurement: "%"
    mode: slider
  theme_card_blur_<entity_32>:
    name: "theme_card_blur_<entity_32>"
    min: -1
    max: 30
    step: 1
    icon: mdi:blur
    unit_of_measurement: "px"
    mode: slider
  theme_card_blur_<entity_31>:
    name: "theme_card_blur_<entity_31>"
    min: -1
    max: 30
    step: 1
    icon: mdi:blur
    unit_of_measurement: "px"
    mode: slider

# --- Command-line sensors ---

command_line:
  - sensor:
      name: theme backgrounds
      command: "python3 /config/scripts/list_theme_backgrounds.py"
      scan_interval: 3600
      value_template: "{{ value_json.count | int(0) }}"
      json_attributes:
        - count
        - file_list

# --- Shell commands ---

shell_command:
  generate_theme_thumbnails: "python3 /config/scripts/generate_theme_thumbnails.py"

# --- Theme action scripts ---
# Tap actions on the Appearance page route through these scripts so that
# tiles can be shared across accounts instead of duplicated per user.
# Each script resolves context.user_id to the calling account's helpers.

script:
  theme_select:
    description: "Set a per-user theme input_select by resolving the calling user"
    fields:
      helper:
        description: "Helper name without username suffix (e.g., theme_mode)"
        selector:
          text:
      option:
        description: "Option to select"
        selector:
          text:
    sequence:
    - &resolve_username
      variables:
        username: >-
          {% set user_map = {'f47...c86': '<entity_31>', '760...94c': '<entity_32>'} %}
          {{ user_map.get(context.user_id, '') }}
    - &unknown_caller_guard
      if:
      - condition: template
        value_template: "{{ username == '' }}"
      then:
      - service: system_log.write
        data:
          message: "Theme script called by unknown user_id: {{ context.user_id }}"
          level: warning
      - stop: "Unknown caller"
    - service: input_select.select_option
      target:
        entity_id: "input_select.{{ helper }}_{{ username }}"
      data:
        option: "{{ option }}"

  theme_set_background:
    description: "Set the per-user theme background"
    fields:
      value:
        description: "Background value (auto, none, hex color, or filename)"
        selector:
          text:
    sequence:
    - *resolve_username
    - *unknown_caller_guard
    - service: input_text.set_value
      target:
        entity_id: "input_text.theme_background_{{ username }}"
      data:
        value: "{{ value }}"

  theme_reset_customization:
    description: "Reset a per-user theme input_number to its default (-1)"
    fields:
      helper:
        description: "Helper name without username suffix (e.g., theme_card_opacity)"
        selector:
          text:
    sequence:
    - *resolve_username
    - *unknown_caller_guard
    - service: input_number.set_value
      target:
        entity_id: "input_number.{{ helper }}_{{ username }}"
      data:
        value: -1

# --- Automations ---

automation:
  - id: theme_generate_background_thumbnails
    alias: "Theme: Generate background thumbnails"
    trigger:
      - platform: state
        entity_id: sensor.theme_backgrounds
    action:
      - service: shell_command.generate_theme_thumbnails
