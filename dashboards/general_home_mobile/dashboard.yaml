        title: Vacuums
        tap_action:
          action: navigate
          navigation_path: /general-home/vacuums
        card_mod:
          style: *theme_exempt_style
    # `color_end` is stated per vacuum rather than derived from `color`.
    # It has to contrast with it, and several palettes define --accent-color
    # close to --primary-color, which makes the gradient close to a flat fill.
    # Pairing them here makes it so if there's any changes, then the contrast
    # color is right next to it and can be adjusted with it if needed.
    - type: conditional
