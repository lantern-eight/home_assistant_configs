                  fontSize: 10px
                  background: transparent
                  color: '#9E9E9E'
                  padding:
                    left: 0
                    right: 0
                    top: 0
                    bottom: 0
        series:
        - entity: sensor.openmeteo_hourly_uv_forecast
          name: Forecast
          type: area
          color: '#03A9F4'
          opacity: 0
          stroke_width: 2
          stroke_dash: 6
          unit: ' '
          show:
            in_header: raw
            legend_value: false
          data_generator: |
            return entity.attributes.time
              .map((t, i) => [new Date(t).getTime(), entity.attributes.uv_index[i]])
              .filter((p) => p[0] >= start.getTime() && p[0] <= end.getTime());
        - entity: sensor.<entity_10>_uv_index
          name: Current
          unit: ' '
          color: *uv_orange
          show:
            in_header: true
            in_chart: false
        - entity: sensor.<entity_10>_uv_index
          name: Actual
          type: area
          color: *uv_orange
          stroke_width: 0
          extend_to: now
          unit: ' '
          color_threshold:
            - value: 0
              color: *uv_green
            - value: 3
              color: *uv_amber
            - value: 6
              color: *uv_orange
            - value: 8
              color: *uv_red
          show:
            in_header: false
            legend_value: false
          group_by:
            func: avg
            duration: 30min
