            const item = (l) => `<div style="display:flex;align-items:center;gap:4px;"><div style="${outline}"></div><span style="font-size:10px;color:var(--secondary-text-color);">${l}</span></div>`;
            const sevItem = (l, i) => `<div style="display:flex;align-items:center;gap:4px;"><div style="width:8px;height:8px;border-radius:50%;background:${sevColors[i]};"></div><span style="font-size:10px;color:var(--secondary-text-color);">${l}</span></div>`;
