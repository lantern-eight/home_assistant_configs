x-theme-view-style: ''
x-theme-bg-card: &id001
  type: markdown
  content: ' '
  card_mod:
    style: |
      :host {
        position: fixed !important;
        inset: 0 !important;
        z-index: -1 !important;
        pointer-events: none !important;
        padding: 0 !important;
        margin: 0 !important;
        height: 0 !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      ha-card {
        position: fixed !important;
        inset: 0 !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        min-height: 0 !important;
        padding: 0 !important;
        pointer-events: none !important;
      }
      ha-card ha-markdown { display: none !important; }
      {% from 'general_home_theme.jinja' import view_background_css %}
      {{ view_background_css(user) }}
x-theme-card-style: &theme_card_style |
  {% from 'general_home_theme.jinja' import theme_css %}
  {{ theme_css(user, 'card') }}
x-theme-exempt-style: &theme_exempt_style |
  {% from 'general_home_theme.jinja' import theme_css %}
  {{ theme_css(user, 'exempt') }}
x-theme-exempt-sub-style: &theme_exempt_sub_style |
  {% from 'general_home_theme.jinja' import theme_css %}
  {{ theme_css(user, 'exempt') }}
  :host {
    --subtitle-font-size: 14px;
  }
x-theme-card-transparent: &theme_card_transparent |
  ha-card {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }
# button-card draws its own border/background through `styles: card:`, which
# lands as inline style. An `!important` rule beats inline, so the exempt
# anchor would erase it — this strips only the themed shadow/blur and leaves
# the button's own surface alone. Palette variables inherit from the parent
# card, so they don't need redeclaring here.
x-theme-button-style: &theme_button_style |
  ha-card {
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
x-theme-chip-style: &theme_chip_style |
  {% from 'general_home_theme.jinja' import theme_css %}
  {{ theme_css(user, 'chip') }}
x-theme-chrome-style: &theme_chrome_style |
  {% from 'general_home_theme.jinja' import theme_css %}
  {{ theme_css(user, 'chrome') }}
# UV index severity colors (Material Design). Defined once, referenced by
# both the annotation band fills and the line color_threshold so they
# stay in sync automatically.
x-uv-colors:
  green: &uv_green '#4CAF50'
  amber: &uv_amber '#FFC107'
  orange: &uv_orange '#FF9800'
  red: &uv_red '#F44336'
x-palette-tile-styles: &palette_tile_styles
  name:
    - font-size: 11px
    - color: var(--secondary-text-color)
    - text-align: center
  grid:
    - grid-template-areas: '"dots" "n"'
    - grid-template-rows: min-content min-content
    - justify-items: center
  custom_fields:
    dots:
      - margin-bottom: 6px
kiosk_mode:
  hide_header: true
  hide_sidebar: true
button_card_templates:
  promoted_chip:
    icon: mdi:door-open
    show_state: false
    show_icon: true
    show_name: true
    tap_action:
      action: more-info
    custom_fields:
      dot: |
        [[[
          // Pulsing dot uses the theme's error color for consistency with
          // notification severity and the severity color mode toggle.
          return `<div style="width:8px;height:8px;border-radius:50%;
            background:var(--error-color);
            box-shadow:0 0 6px color-mix(in srgb, var(--error-color) 50%, transparent);"></div>`;
        ]]]
    styles:
      card:
      - background: "color-mix(in srgb, var(--error-color) 10%, transparent)"
      - border: "1px solid color-mix(in srgb, var(--error-color) 18%, transparent)"
      - padding: 10px 16px
      icon:
      - color: "var(--error-color)"
      - width: 20px
      name:
      - font-size: 14px
      - font-weight: 500
      - justify-self: start
      grid:
      - grid-template-areas: '"i n dot"'
      - grid-template-columns: min-content 1fr min-content
      - align-items: center
    card_mod:
      style: *theme_chip_style
  notification_list:
    entity: sensor.dashboard_notifications
    show_name: false
    show_state: false
    show_icon: false
    variables:
      filter_active: false
      show_limit: 0
      show_overflow: false
      show_empty: false
    custom_fields:
      list: |
        [[[
          // Severity colors resolve via CSS custom properties set by the
          // theme macro — either fixed universal values or palette-matched,
          // depending on the user's severity color mode preference.
          const colors = {
            red: 'var(--error-color)',
            amber: 'var(--warning-color)',
            blue: 'var(--info-color)',
            green: 'var(--success-color)'
          };
          let items = entity.attributes.items || [];
          if (variables.filter_active) {
            items = items.filter(i => i.active && !i.promoted);
          }
          const total = items.length;
          if (variables.show_limit > 0) {
            items = items.slice(0, variables.show_limit);
          }

          let out = '<div style="display:flex;flex-direction:column;">';

          for (const item of items) {
            const c = colors[item.severity];
            const hasProgress = item.progress !== undefined && item.progress !== null;

            out += `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;
              border-bottom:1px solid rgba(var(--rgb-primary-text-color),0.05);">`;
            out += `<div style="width:3px;align-self:stretch;border-radius:2px;background:${c};"></div>`;
            out += `<ha-icon icon="${item.icon}" style="--mdc-icon-size:18px;color:${c};flex-shrink:0;"></ha-icon>`;
            out += '<div style="flex:1;min-width:0;">';
            out += '<div style="display:flex;justify-content:space-between;align-items:baseline;">';
            out += `<span style="font-size:13px;">${item.label}</span>`;

            if (item.time_remaining) {
              out += `<span style="font-size:11px;color:var(--secondary-text-color);flex-shrink:0;margin-left:8px;">${item.time_remaining}</span>`;
            }
            out += '</div>';

            if (hasProgress) {
              out += `<div style="height:3px;background:rgba(var(--rgb-primary-text-color),0.1);border-radius:2px;margin-top:4px;">`;
              out += `<div style="height:100%;width:${Math.min(item.progress,100)}%;background:${c};border-radius:2px;transition:width 0.5s;"></div>`;
              out += '</div>';
            }

            out += '</div></div>';
          }

          if (variables.show_overflow && total > (variables.show_limit || Infinity)) {
            out += `<a href="/general-home/conditionals" style="display:block;text-align:center;padding:8px;font-size:12px;color:var(--primary-color);text-decoration:none;">View all →</a>`;
          }

          if (variables.show_empty && !total) {
            out += '<div style="text-align:center;padding:12px;font-size:13px;color:var(--secondary-text-color);">No items</div>';
          }

          out += '</div>';
          return out;
        ]]]
    styles:
      card:
      - padding: 4px 12px 8px
      - background: none
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"list"'
  palette_tile:
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: call-service
      service: script.theme_select
      service_data:
        helper: theme_palette
        option: "[[[ return variables.palette_name ]]]"
    custom_fields:
      dots: |
        [[[
          const id = variables.identity_colors;
          const sev = variables.severity_colors;
          const dot = (c) => `<div style="width:8px;height:8px;border-radius:50%;background:${c}"></div>`;
          const col = (cs) => `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">${cs.map(dot).join('')}</div>`;
          return `<div style="display:flex;gap:8px;justify-content:center;">${col(id)}${col(sev)}</div>`;
        ]]]
    styles:
      <<: *palette_tile_styles
      card:
        - padding: 10px 4px
  air_dot_tile:
    show_state: false
    show_icon: false
    show_name: true
    tap_action:
      action: more-info
    variables:
      thresholds: []
      initial_level: 0
      decimals: 0
      unit_label: ''
    custom_fields:
      dots: |
        [[[
          const val = parseFloat(entity.state);
          if (isNaN(val)) return '';
          const thresholds = variables.thresholds;
          let level = variables.initial_level || 0;
          for (const t of thresholds) {
            if (Array.isArray(t)) {
              if (val > t[0] || val < t[1]) level++;
            } else {
              if (val > t) level++;
            }
          }
          const colors = ['#4CAF50','#8BC34A','#FFC107','#FF9800','#FF5722','#9C27B0'];
          const d = (i) => `<div style="width:7px;height:7px;border-radius:50%;background:${i < level ? colors[i] : '#555'}"></div>`;
          return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">${d(5)}${d(4)}${d(3)}${d(2)}${d(1)}${d(0)}</div>`;
        ]]]
      value: |
        [[[
          const decimals = variables.decimals || 0;
          return `<span style="font-size:14px;font-weight:bold;">${parseFloat(entity.state).toFixed(decimals)}</span>`;
        ]]]
      unit: |
        [[[
          return `<span style="font-size:10px;color:var(--secondary-text-color);">${variables.unit_label}</span>`;
        ]]]
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: 8px 2px
      name:
      - font-size: 11px
      - color: var(--secondary-text-color)
      grid:
      - grid-template-areas: '"dots" "n" "value" "unit"'
      - grid-template-rows: min-content min-content min-content min-content
      custom_fields:
        dots:
        - margin-bottom: 6px
        value:
        - margin-top: 2px
        unit:
        - margin-top: 0px
  # ------------- Vacuum Components -------------
  # Every instance passes vacuum name, palette color vacuum is themed with,
  # and second stop of its gradient. Alpha variants use color-mix so the
  # design's rgba() tints stay theme-aware instead of hardcoding a palette.

  # Foundation for every vacuum card. Three things:
  #
  #  - `label`: The vacuum's display name, capitalised from the entity name.
  #  - `room_list`: The parse of a stored comma-separated id list. This mirrors
  #      the writer, so reader and writer agree on what the value means.
  #  - button-card theme exemption.
  #
  # button-card resolves variables lazily through a memoising proxy, so a
  # variable can read another and nothing is evaluated unless it is used.
  # Reading `states` inside one still registers the entity for updates.
  vacuum_base:
    variables:
      vacuum: ''
      label: |
        [[[
          return variables.vacuum.charAt(0).toUpperCase() + variables.vacuum.slice(1);
        ]]]
      # Which list `room_list` reads: the user's selection, or the snapshot taken
      # when the running sequence started.
      room_list_source: selected_rooms
      # `entity` is one of the parameters button-card injects into a JS
      # template. A local var of that name is a redeclaration and the whole
      # template fails to compile. Same for: states, user, hass, variables,
      # html and helpers.
      room_list: |
        [[[
          const source =
            states[`input_text.${variables.vacuum}_${variables.room_list_source}`];
          return (source?.state || '').split(',')
            .map((id) => id.trim()).filter((id) => /^[0-9]+$/.test(id));
        ]]]
    card_mod:
      style: *theme_button_style

  # Room chip. Icon doubles as the selection indicator: a check in the vacuum
  # color when selected, the room's own icon when not.
  vacuum_room_chip:
    template: vacuum_base
    show_state: false
    show_icon: true
    show_name: true
    layout: icon_name
    variables:
      room_id: ''
      color: var(--primary-color)
      color_end: var(--warning-color)
      selected: |
        [[[ return variables.room_list.includes(variables.room_id); ]]]
      room: |
        [[[
          const config = states[`sensor.${variables.vacuum}_room_config`];
          const rooms = config?.attributes?.rooms || [];
          return rooms.find((entry) => entry.id === variables.room_id) || {};
        ]]]
    icon: |
      [[[
        return variables.selected
          ? 'mdi:check' : (variables.room.icon || 'mdi:floor-plan');
      ]]]
    name: "[[[ return variables.room.name || `Room ${variables.room_id}` ]]]"
    tap_action:
      action: call-service
      service: script.vacuum_toggle_room
      service_data:
        vacuum_name: "[[[ return variables.vacuum ]]]"
        room_id: "[[[ return variables.room_id ]]]"
    styles:
      card:
      - padding: 8px 13px
      - border-radius: 10px
      # Anchors the gradient ring drawn by extra_styles below.
      - position: relative
      - transition: all 0.15s ease
      - background: |
          [[[
            if (!variables.selected)
              return 'color-mix(in srgb, var(--primary-text-color) 4%, transparent)';
            return `linear-gradient(135deg,
              color-mix(in srgb, ${variables.color} 16%, transparent),
              color-mix(in srgb, ${variables.color_end} 16%, transparent))`;
          ]]]
      - border: |
          [[[
            return variables.selected ? '1px solid transparent'
              : '1px solid color-mix(in srgb, var(--primary-text-color) 9%, transparent)';
          ]]]
      icon:
      - width: 14px
      - --mdc-icon-size: 14px
      - color: |
          [[[
            return variables.selected
              ? variables.color : 'var(--secondary-text-color)';
          ]]]
      name:
      - font-size: 13px
      - white-space: nowrap
      # Room names come from the 3rd party vacuum app.
      - text-transform: capitalize
      - color: |
          [[[
            return variables.selected
              ? 'var(--primary-text-color)' : 'var(--secondary-text-color)';
          ]]]
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content max-content
      # One row only. button-card keeps its default three-row track list even
      # when state and label are hidden, and the two empty tracks still take
      # their share of `gap` — which lands as dead space under the label and
      # pushes it off center.
      - grid-template-rows: 1fr
      - justify-content: center
      - align-items: center
      - gap: 6px
    # A gradient can't be used as a `border` color, so the selected chip
    # paints one into a ::before and masks the middle out, leaving a 1px
    # ring. Same two-tone as the start button, so a picked room reads as
    # already belonging to that vacuum's run.
    extra_styles: |
      [[[
        if (!variables.selected) return '';
        return `
          ha-card::before {
            content: '';
            position: absolute;
            inset: 0;
            /* Matches the card's own radius. Stated outright rather than
               inherited, so the ring is never drawn square in the window
               before the card's inline radius lands. */
            border-radius: 10px;
            padding: 1px;
            background: linear-gradient(135deg,
              ${variables.color}, ${variables.color_end});
            -webkit-mask: linear-gradient(#000 0 0) content-box,
                          linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box,
                  linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
          }`;
      ]]]

  # One segment of the per-vacuum Passes control.
  vacuum_pass_segment:
    template: vacuum_base
    show_state: false
    show_icon: false
    show_name: true
    variables:
      passes: 1
      color: var(--primary-color)
      selected: |
        [[[
          return parseFloat(
            states[`input_number.${variables.vacuum}_passes`]?.state
          ) === variables.passes;
        ]]]
    name: "[[[ return `${variables.passes}×` ]]]"
    tap_action:
      action: call-service
      service: input_number.set_value
      service_data:
        entity_id: "[[[ return `input_number.${variables.vacuum}_passes` ]]]"
        value: "[[[ return variables.passes ]]]"
    styles: &segment_styles
      card:
      - padding: 6px 14px
      - border-radius: 7px
      - border: none
      - transition: all 0.15s ease
      - background: |
          [[[
            return variables.selected
              ? `color-mix(in srgb, ${variables.color} 18%, transparent)`
              : 'transparent';
          ]]]
      name:
      - font-size: 12px
      - white-space: nowrap
      - font-weight: "[[[ return variables.selected ? '600' : '500' ]]]"
      - color: |
          [[[
            return variables.selected
              ? 'var(--primary-text-color)' : 'var(--secondary-text-color)';
          ]]]

  # One segment of the per-vacuum Empty Mode control.
  vacuum_empty_mode_segment:
    template: vacuum_base
    show_state: false
    show_icon: false
    show_name: true
    variables:
      # 'each_room' or 'end_only'
      mode: each_room
      color: var(--primary-color)
      selected: |
        [[[
          const between = states[`input_boolean.${variables.vacuum}_empty_between_rooms`]?.state === 'on';
          return variables.mode === 'each_room' ? between : !between;
        ]]]
    name: |
      [[[
        return variables.mode === 'each_room' ? 'Each Room' : 'End Only';
      ]]]
    tap_action:
      action: call-service
      service: |
        [[[ return variables.mode === 'each_room'
          ? 'input_boolean.turn_on' : 'input_boolean.turn_off' ]]]
      service_data:
        entity_id: "[[[ return `input_boolean.${variables.vacuum}_empty_between_rooms` ]]]"
    styles: *segment_styles

  # Mop toggle. Only rendered for vacuums whose mop_after_vacuum
  # helper exists.
  vacuum_mop_toggle_segment:
    template: vacuum_base
    show_state: false
    show_icon: false
    show_name: true
    variables:
      mode: 'on'
      color: var(--primary-color)
      selected: |
        [[[
          const mopOn = states[`input_boolean.${variables.vacuum}_mop_after_vacuum`]?.state === 'on';
          return variables.mode === 'on' ? mopOn : !mopOn;
        ]]]
    name: |
      [[[
        return variables.mode === 'on' ? 'On' : 'Off';
      ]]]
    tap_action:
      action: call-service
      service: |
        [[[ return variables.mode === 'on'
          ? 'input_boolean.turn_on' : 'input_boolean.turn_off' ]]]
      service_data:
        entity_id: "[[[ return `input_boolean.${variables.vacuum}_mop_after_vacuum` ]]]"
    styles: *segment_styles

  # Preset chip — sets the whole room selection at once. Highlights when the
  # current selection already matches the preset.
  vacuum_preset_chip:
    template: vacuum_base
    show_state: false
    show_icon: false
    show_name: true
    variables:
      # Either a literal comma-separated id list, or list resolved from
      # room_config. Sensor so no segment id is restated outside
      # packages/vacuum_rooms.jinja.
      rooms: ''
      color: var(--primary-color)
      room_ids: |
        [[[
          if (variables.rooms === 'all') {
            const config = states[`sensor.${variables.vacuum}_room_config`];
            const rooms = config?.attributes?.rooms || [];
            return rooms.map((room) => room.id).join(',');
          }
          const config = states[`sensor.${variables.vacuum}_room_config`];
          const rooms = config?.attributes?.rooms || [];
          const matched = rooms
            .filter((room) => (room.labels || []).includes(variables.rooms));
          return matched.length ? matched.map((room) => room.id).join(',')
            : variables.rooms;
        ]]]
      selected: |
        [[[
          const wanted = variables.room_ids.split(',').filter(Boolean).sort().join(',');
          // Copied before sorting: room_list is memoised and shared with
          // every other card on this vacuum, so sorting it in place would
          // reorder what they read.
          const current = [...variables.room_list].sort().join(',');
          return !!wanted && current === wanted;
        ]]]
    tap_action:
      # A preset that resolves to nothing must not fire. vacuum_set_rooms
      # parses an empty string as an empty list, and since that never equals
      # a non-empty selection it takes the "set" branch and writes the
      # selection away — so tapping "All Rooms" would clear the selection
      # instead of filling it. Both keyword presets read room_config, which
      # is absent for a moment at startup, during the first frames of a card
      # render, and after a macro edit without a homeassistant.reload_custom_templates.
      action: "[[[ return variables.room_ids ? 'call-service' : 'none' ]]]"
      service: script.vacuum_set_rooms
      service_data:
        vacuum_name: "[[[ return variables.vacuum ]]]"
        room_ids: "[[[ return variables.room_ids ]]]"
    # Deliberately flatter than a selected room chip: the presets are a way
    # in, the rooms are the actual selection, and only one of them should be
    # highlighted at a time.
    styles:
      card:
      - padding: 8px 12px
      - border-radius: 10px
      - transition: all 0.15s ease
      - background: |
          [[[
            return variables.selected
              ? `color-mix(in srgb, ${variables.color} 10%, transparent)`
              : 'color-mix(in srgb, var(--primary-text-color) 4%, transparent)';
          ]]]
      - border: |
          [[[
            return variables.selected
              ? `1px solid color-mix(in srgb, ${variables.color} 20%, transparent)`
              : '1px solid color-mix(in srgb, var(--primary-text-color) 8%, transparent)';
          ]]]
      name:
      - font-size: 12px
      - font-weight: 500
      - white-space: nowrap
      - color: |
          [[[
            return variables.selected
              ? variables.color : 'var(--secondary-text-color)';
          ]]]

  # Gradient start button. Dims to a flat disabled fill when no rooms are selected.
  # `color` carries the vacuum's identity and `color_end` the second stop, so
  # both buttons are two-tone and still read as different machines.
  vacuum_start_button:
    template: vacuum_base
    show_state: false
    show_icon: true
    show_name: true
    layout: icon_name
    icon: mdi:play
    variables:
      color: var(--primary-color)
      color_end: var(--warning-color)
      count: "[[[ return variables.room_list.length ]]]"
    name: |
      [[[
        const count = variables.count;
        if (!count) return `Select rooms for ${variables.label}`;
        return `Start ${variables.label} · ${count} room${count > 1 ? 's' : ''}`;
      ]]]
    tap_action:
      # With nothing selected the button only *looks* disabled — tapping it
      # would still confirm and then hit the script's own room-count condition,
      # which fails silently. button-card resolves `action` as a template and
      # short-circuits on `none` before it reads `confirmation`, so this
      # suppresses the unneeded dialog as well as the call.
      action: |
        [[[ return variables.count ? 'call-service' : 'none' ]]]
      service: script.vacuum_clean_rooms_sequence
      service_data:
        vacuum_entity: "[[[ return `vacuum.${variables.vacuum}` ]]]"
    styles:
      card:
      - padding: 14px
      - border: none
      - border-radius: 13px
      - transition: all 0.15s ease
      - background: |
          [[[
            if (!variables.count)
              return 'color-mix(in srgb, var(--primary-text-color) 6%, transparent)';
            return `linear-gradient(135deg, ${variables.color}, ${variables.color_end})`;
          ]]]
      icon:
      - width: 16px
      - --mdc-icon-size: 16px
      - color: |
          [[[
            return variables.count
              ? 'var(--text-primary-color, #fff)' : 'var(--secondary-text-color)';
          ]]]
      name:
      - font-size: 16px
      - font-weight: 600
      - color: |
          [[[
            return variables.count
              ? 'var(--text-primary-color, #fff)' : 'var(--secondary-text-color)';
          ]]]
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content max-content
      # See vacuum_room_chip — collapses button-card's unused state/label rows.
      - grid-template-rows: 1fr
      - justify-content: center
      - align-items: center
      - gap: 8px

  # Skip / Stop. `tone` is the accent, stop passes the error color.
  vacuum_control_button:
    template: vacuum_base
    show_state: false
    show_icon: true
    show_name: true
    layout: icon_name
    variables:
      tone: ''
    styles:
      card:
      - padding: 11px
      - border-radius: 12px
      - background: |
          [[[
            return variables.tone
              ? `color-mix(in srgb, ${variables.tone} 8%, transparent)`
              : 'color-mix(in srgb, var(--primary-text-color) 5%, transparent)';
          ]]]
      - border: |
          [[[
            return variables.tone
              ? `1px solid color-mix(in srgb, ${variables.tone} 15%, transparent)`
              : '1px solid transparent';
          ]]]
      icon:
      - width: 15px
      - --mdc-icon-size: 15px
      - color: "[[[ return variables.tone || 'var(--secondary-text-color)' ]]]"
      name:
      - font-size: 15px
      - font-weight: 500
      - color: "[[[ return variables.tone || 'var(--secondary-text-color)' ]]]"
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: min-content max-content
      # See vacuum_room_chip — collapses button-card's unused state/label rows.
      - grid-template-rows: 1fr
      - justify-content: center
      - align-items: center
      - gap: 6px

  # The header both card modes draw: a 40px avatar slot, the vacuum's name and
  # floor, a status line, and an optional block pinned to the right.
  vacuum_identity:
    template: vacuum_base
    show_state: false
    show_icon: false
    show_name: false
    variables:
      floor: ''
      # The color the status line and the avatar are drawn in. Not always the
      # vacuum's identity color: a running sequence uses the working color
      # instead, so the card reads as "busy".
      accent: var(--primary-color)
      # Markup for the inside of the 40px avatar slot. The slot is
      # position:relative, so either mode can fill it with absolutely
      # positioned children.
      avatar: ''
      status_line: ''
      # The live mode's status line is the thing being read during a run, so
      # it sits a step above the idle card's dock/battery line.
      status_size: 12px
      # Optional markup pinned to the right of the row.
      trailing: ''
      header: |
        [[[
          return `
            <div style="display:flex;align-items:center;gap:12px;width:100%">
              <div style="width:40px;height:40px;position:relative;flex-shrink:0"
                   >${variables.avatar}</div>
              <div style="flex:1;min-width:0;text-align:left">
                <div style="display:flex;align-items:baseline;gap:6px">
                  <span style="font-size:16px;font-weight:600;
                               color:var(--primary-text-color)"
                        >${variables.label}</span>
                  <span style="font-size:12px;color:var(--secondary-text-color)"
                        >${variables.floor}</span>
                </div>
                <div style="font-size:${variables.status_size};
                            color:${variables.accent};margin-top:2px"
                     >${variables.status_line}</div>
              </div>
              ${variables.trailing}
            </div>`;
        ]]]
    tap_action:
      action: more-info
      entity: "[[[ return `vacuum.${variables.vacuum}` ]]]"
    styles:
      card:
      - padding: 16px 18px 12px
      - background: none
      - border: none
      grid:
      - grid-template-areas: '"body"'

  # Idle header: avatar, name, floor, dock/battery line.
  vacuum_idle_header:
    template: vacuum_identity
    variables:
      avatar: |
        [[[
          const tint = `color-mix(in srgb, ${variables.accent} 10%, transparent)`;
          return `
            <div style="position:absolute;inset:0;border-radius:50%;display:flex;
                        align-items:center;justify-content:center;background:${tint}">
              <ha-icon icon="phu:<entity_42>"
                       style="--mdc-icon-size:20px;color:${variables.accent}"></ha-icon>
            </div>`;
        ]]]
      # Either half can be missing: the status sensor is briefly `unknown` at
      # startup, and both go `unavailable` when the vacuum drops off the
      # network. Joining only the parts that resolved keeps this from
      # rendering as a stray separator (" · 100%") or a bare unit ("–%").
      status_line: |
        [[[
          const unset = (value) =>
            !value || value === 'unknown' || value === 'unavailable';
          const statusState = states[`sensor.${variables.vacuum}_status`]?.state;
          const batteryState = states[`sensor.${variables.vacuum}_battery`]?.state;
          const status = unset(statusState) ? ''
            : statusState.replace(/_/g, ' ').replace(/^./, (ch) => ch.toUpperCase());
          const battery = unset(batteryState) ? '' : `${batteryState}%`;
          return [status, battery].filter(Boolean).join(' · ') || 'Unavailable';
        ]]]
    custom_fields:
      body: "[[[ return variables.header ]]]"

  # Live queue body: progress ring, room queue, overall bar, dock line. The
  # header row is vacuum_identity's, filled in with the ring, the working
  # color and this run's status line.
  vacuum_live_body:
    template: vacuum_identity
    variables:
      # The live card renders the snapshot taken when the run started rather
      # than the selection helper, so editing the selection mid-run does not
      # reorder the queue being worked through.
      room_list_source: sequence_queue
      accent: var(--warning-color)
      status_size: 13px
      index: |
        [[[
          return parseInt(
            states[`input_number.${variables.vacuum}_sequence_index`]?.state) || 0;
        ]]]
      room_percent: |
        [[[
          return parseInt(
            states[`sensor.${variables.vacuum}_cleaning_progress`]?.state) || 0;
        ]]]
      # The queue's segment ids mapped to display labels. Two things below
      # need them — the status line names the current room, the chip row
      # names all of them — so they are resolved here once instead of each
      # doing its own lookup.
      queue_labels: |
        [[[
          const config = states[`sensor.${variables.vacuum}_room_config`];
          const rooms = config?.attributes?.rooms || [];
          return variables.room_list.map((id) => {
            const room = rooms.find((entry) => entry.id === id);
            return room ? (room.short || room.name) : `Room ${id}`;
          });
        ]]]
      # Completed rooms plus however far the current one has got. Clamped at
      # both ends: index is 0 for the moment before the first room is
      # published, which makes this negative. A negative width or dasharray
      # is an invalid declaration, the browser drops it and both the bar and
      # the ring would render complete.
      overall: |
        [[[
          if (variables.mop_phase) return 100;
          const total = variables.room_list.length;
          if (!total) return 0;
          const done = (variables.index - 1) + variables.room_percent / 100;
          return Math.max(0, Math.min(100, Math.round((done / total) * 100)));
        ]]]
      mop_phase: |
        [[[
          return variables.index > variables.room_list.length;
        ]]]
      status_line: |
        [[[
          const vacuumState = states[`vacuum.${variables.vacuum}`]?.state;
          const statusRaw = states[`sensor.${variables.vacuum}_status`]?.state || '';

          // Three entities describe what the vacuum is doing and they report
          // differently at different times:
          //   vacuum.<vacuum>        — flips to 'cleaning' the moment the job starts.
          //   sensor.<vacuum>_status — reports transient states like emptying.
          //   binary_sensor.<vacuum>_cleaning — turns on ~30s after a room really
          //     starts, stays on during mid-room battery returns, off between rooms.
          //     Used here to distinguish between charging between rooms and charging
          //     mid-room but will continue.

          // Mop phase: index exceeds room count.
          if (variables.mop_phase) {
            if (vacuumState === 'cleaning') return 'Mopping';
            if (vacuumState === 'docked') {
              const bat = states[`sensor.${variables.vacuum}_battery`]?.state;
              return `Charging for mop · ${bat || '–'}%`;
            }
            return statusRaw.replace(/_/g, ' ')
              .replace(/^./, (ch) => ch.toUpperCase()) || 'Preparing to mop';
          }

          // Vacuum phase
          // Status line priority:
          //   1. Paused (optimistic flag)      → "Paused · {room}"
          //   2. Cleaning (vacuum entity)      → "Cleaning {room} · {pct}%"
          //   3. Emptying bin (status sensor)   → "Emptying bin"
          //   4. Docked + firmware active job   → "Charging · will resume {room}"
          //   5. Docked, no firmware job        → "Charging between rooms"
          //   6. Fallback                       → formatted status sensor
          const paused = states[`input_boolean.${variables.vacuum}_sequence_paused`]?.state === 'on';
          // index is still 0 for the moment between the run being flagged and
          // the first room being published, so key the status off whether a
          // room resolved rather than off 'cleaning'.
          const labels = variables.queue_labels;
          const current = variables.index > 0 && variables.index <= labels.length
            ? labels[variables.index - 1] : '';
          if (!current) return 'Starting…';
          if (paused) return `Paused · ${current}`;
          if (vacuumState === 'cleaning')
            return `Cleaning ${current} · ${variables.room_percent}%`;
          if (statusRaw === 'emptying_the_bin') return 'Emptying bin';
          // Distinguish mid-room battery return (firmware has an active job,
          // binary_sensor stays on) from between-room charging (no active job).
          if (vacuumState === 'docked') {
            const firmwareJob = states[`binary_sensor.${variables.vacuum}_cleaning`]?.state === 'on';
            if (firmwareJob) return `Charging · will resume ${current}`;
            return 'Charging between rooms';
          }
          return statusRaw.replace(/_/g, ' ')
            .replace(/^./, (ch) => ch.toUpperCase()) || 'Working';
        ]]]
      avatar: |
        [[[
          const circumference = 2 * Math.PI * 17;
          const dash = (variables.overall / 100) * circumference;
          const drawn = dash.toFixed(1);
          const gap = (circumference - dash).toFixed(1);
          const track = `color-mix(in srgb, ${variables.accent} 15%, transparent)`;
          return `
            <svg width="40" height="40" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="17" fill="none" stroke="${track}"
                      stroke-width="3.5"/>
              <circle cx="20" cy="20" r="17" fill="none"
                      stroke="${variables.accent}" stroke-width="3.5"
                      stroke-linecap="round" transform="rotate(-90 20 20)"
                      stroke-dasharray="${drawn} ${gap}"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;
                        align-items:center;justify-content:center">
              <ha-icon icon="phu:<entity_42>"
                       style="--mdc-icon-size:18px;color:${variables.accent}"></ha-icon>
            </div>`;
        ]]]
      trailing: |
        [[[
          const accent = variables.accent;
          if (variables.mop_phase) {
            return `
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                <ha-icon icon="mdi:water"
                         style="--mdc-icon-size:20px;color:${accent}"></ha-icon>
                <span style="font-size:12px;font-weight:600;color:${accent}"
                      >Mop</span>
              </div>`;
          }
          const passes = parseInt(
            states[`input_number.${variables.vacuum}_passes`]?.state) || 1;
          return `
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
              <div style="padding:4px 9px;border-radius:6px;font-size:11px;
                          font-weight:600;color:${accent};
                          background:color-mix(in srgb, ${accent} 12%, transparent)"
                   >${passes}×</div>
              <div style="font-size:22px;font-weight:700;color:${accent};line-height:1"
                   >${variables.index}<span style="font-size:13px;font-weight:400;
                                          color:var(--secondary-text-color)"
                         >/${variables.room_list.length}</span></div>
            </div>`;
        ]]]
    custom_fields:
      body: |
        [[[
          const accent = variables.accent;
          const green = 'var(--success-color)';
          const index = variables.index;

          // Mop phase: show a simplified body with battery and status.
          if (variables.mop_phase) {
            const batteryState = states[`sensor.${variables.vacuum}_battery`]?.state;
            const batteryValid = batteryState && batteryState !== 'unknown'
              && batteryState !== 'unavailable';
            const vacuumState = states[`vacuum.${variables.vacuum}`]?.state;
            const isMopping = vacuumState === 'cleaning';
            const batteryLine = !batteryValid ? ''
              : `<div style="display:flex;align-items:center;gap:6px;margin-top:8px">
                   <ha-icon icon="${isMopping ? 'mdi:water' : 'mdi:battery-charging'}"
                            style="--mdc-icon-size:12px;color:var(--secondary-text-color)"></ha-icon>
                   <span style="font-size:11px;color:var(--secondary-text-color)"
                         >Battery ${batteryState}%${!isMopping ? ' — charging' : ''}</span>
                 </div>`;

            // All vacuum rooms shown as done.
            const doneChips = variables.queue_labels.map((label) => {
              const base = 'padding:5px 10px;border-radius:8px;font-size:12px;'
                         + 'white-space:nowrap;text-transform:capitalize;';
              return `<span style="${base}background:color-mix(in srgb, ${green} 10%, transparent);color:color-mix(in srgb, ${green} 65%, var(--card-background-color));text-decoration:line-through">${label}</span>`;
            }).join('');

            return `
              <div style="width:100%;text-align:left">
                ${variables.header}

                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"
                     >${doneChips}</div>

                <div style="height:4px;border-radius:2px;margin-top:14px;overflow:hidden;
                            background:color-mix(in srgb, var(--primary-text-color) 7%, transparent)">
                  <div style="height:100%;width:100%;border-radius:2px;
                              background:linear-gradient(90deg, ${accent},
                                         color-mix(in srgb, ${accent} 60%, #ffffff))"></div>
                </div>

                ${batteryLine}
              </div>`;
          }

          const chips = variables.queue_labels.map((label, position) => {
            const number = position + 1;
            const base = 'padding:5px 10px;border-radius:8px;font-size:12px;'
                       + 'white-space:nowrap;text-transform:capitalize;';
            if (number < index) return `<span style="${base}background:color-mix(in srgb, ${green} 10%, transparent);color:color-mix(in srgb, ${green} 65%, var(--card-background-color));text-decoration:line-through">${label}</span>`;
            if (number === index) return `<span style="${base}background:color-mix(in srgb, ${accent} 15%, transparent);border:1px solid color-mix(in srgb, ${accent} 25%, transparent);color:${accent};font-weight:600">${label}</span>`;
            return `<span style="${base}background:color-mix(in srgb, var(--primary-text-color) 4%, transparent);color:var(--secondary-text-color)">${label}</span>`;
          }).join('');

          // Context lines below the progress bar — emptying, charging, or battery.
          const emptying =
            states[`sensor.${variables.vacuum}_status`]?.state === 'emptying_the_bin';
          const dockLine = emptying
            ? `<div style="display:flex;align-items:center;gap:6px;margin-top:10px">
                 <ha-icon icon="mdi:tray-arrow-down"
                          style="--mdc-icon-size:12px;color:var(--secondary-text-color)"></ha-icon>
                 <span style="font-size:11px;color:var(--secondary-text-color)"
                       >Emptying bin between rooms</span>
               </div>`
            : '';

          // Battery line — when docked and charging during a run, show
          // "Battery X% — charging" to give context for the Continue button.
          // When not docked (cleaning, paused), show plain "Battery X%".
          // Dropped rather than rendered as "Battery –%" when the sensor
          // is unknown.
          const batteryState = states[`sensor.${variables.vacuum}_battery`]?.state;
          const batteryValid = batteryState && batteryState !== 'unknown'
            && batteryState !== 'unavailable';
          const isDocked = states[`vacuum.${variables.vacuum}`]?.state === 'docked';
          const batteryLine = !batteryValid ? ''
            : isDocked && !emptying
              ? `<div style="display:flex;align-items:center;gap:6px;margin-top:8px">
                   <ha-icon icon="mdi:battery-charging"
                            style="--mdc-icon-size:12px;color:var(--secondary-text-color)"></ha-icon>
                   <span style="font-size:11px;color:var(--secondary-text-color)"
                         >Battery ${batteryState}% — charging</span>
                 </div>`
              : `<div style="font-size:11px;color:var(--secondary-text-color);
                             margin-top:8px">Battery ${batteryState}%</div>`;

          return `
            <div style="width:100%;text-align:left">
              ${variables.header}

              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"
                   >${chips}</div>

              <div style="height:4px;border-radius:2px;margin-top:14px;overflow:hidden;
                          background:color-mix(in srgb, var(--primary-text-color) 7%, transparent)">
                <div style="height:100%;width:${variables.overall}%;border-radius:2px;
                            background:linear-gradient(90deg, ${accent},
                                       color-mix(in srgb, ${accent} 60%, #ffffff))"></div>
              </div>

              ${dockLine}
              ${batteryLine}
            </div>`;
        ]]]

# Both vacuum cards are the same body with four variables: which vacuum,
# its floor label, and the two stops of its identity gradient. It is defined
# once here and instantiated twice under `views:`.
#
# streamline substitutes by string-replacing `[[name]]` over the JSON of this
# block, building one regex per declared variable — so button-card's own
# `[[[ ... ]]]` templates are never touched, and a variable reaches anywhere a
# string does, including inside the auto-entities Jinja below. Values are
# quoted wherever a bare `[[` would otherwise read as a YAML flow sequence.
#
# No `default:` block on purpose: an unset variable would render as a literal
# `[[vacuum]]` in an entity id and fails visibly, rather than quietly drawing the
# other vacuum's card.
streamline_templates:
  vacuum_card:
    card:
      type: custom:stack-in-card
      mode: vertical
      # stack-in-card merges children by walking every descendant ha-card
      # 500ms after render and writing borderRadius:0 / background:
      # transparent / boxShadow:none straight onto their inline style —
      # which beats everything button-card sets. Without these 'keeps' the
      # chips lose their radius and the start button loses its gradient
      # until something forces a re-render. The children here are all
      # button-cards that style themselves, so there is no chrome to strip.
      keep:
        border_radius: true
        background: true
        box_shadow: true
      # The plain card treatment: it carries the palette variables every
      # chip below reads, and leaves radius, surface opacity and blur to
      # the user's style.
      card_mod:
        style:
          .: *theme_card_style
          hui-vertical-stack-card$: |
            #root > * { margin: 0 !important; }
      cards:

      # ---- live queue mode ----
      - type: conditional
        conditions:
        - condition: state
          entity: 'input_boolean.[[vacuum]]_sequence_running'
          state: 'on'
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            template: vacuum_live_body
            variables:
              vacuum: '[[vacuum]]'
              floor: '[[floor]]'
          - type: grid
            columns: 3
            square: false
            card_mod:
              style:
                # `#root` is in the grid card's own shadow root, so it is
                # reached through `.`. A `hui-grid-card$` key looks for a
                # grid card nested inside this one and matches nothing.
                .: |
                  #root { gap: 8px !important; padding: 6px 18px 16px !important; }
            cards:
            # Pause / Continue — adapts icon, label and tone to vacuum state.
            #
            #   State                | Icon  | Label    | Tap
            #   ---------------------|-------|----------|---------------------------
            #   Cleaning             | pause | Pause    | Pause the vacuum in place
            #   Paused               | play  | Continue | Resume cleaning
            #   Docked + low battery | play  | Continue | Break charge wait early
            #   Transitional         | pause | Pause    | Disabled (gray, no-op)
            - type: custom:button-card
              template: vacuum_control_button
              variables:
                # vacuum must be set here because JS templates ([[[...]]]) cannot
                # use streamline's [[vacuum]] substitution — streamline skips
                # triple-bracket blocks. This line IS substituted (plain YAML),
                # making variables.vacuum available to the JS templates below.
                vacuum: '[[vacuum]]'
                # Determine the button's mode from vacuum state. Computed once
                # so icon, name, tone and tap_action can branch without
                # repeating entity lookups.
                #
                #   'pause'         — cleaning, pauses
                #   'continue'      — paused mid-floor, resumes
                #   'continue_dock' — docked + low battery, sends back out
                #   'inactive'      — transitional (emptying, settling), gray
                pause_mode: |
                  [[[
                    const paused = states[`input_boolean.${variables.vacuum}_sequence_paused`]?.state === 'on';
                    const vacuumState = states[`vacuum.${variables.vacuum}`]?.state;
                    // If NaN from unavailable sensor, default 0.
                    const batteryLow = (parseInt(states[`sensor.${variables.vacuum}_battery`]?.state) || 0) < 25;
                    if (paused) return 'continue';
                    if (vacuumState === 'cleaning') return 'pause';
                    if (vacuumState === 'docked' && batteryLow) return 'continue_dock';
                    return 'inactive';
                  ]]]
                tone: |
                  [[[
                    return variables.pause_mode !== 'inactive'
                      ? 'var(--warning-color)' : '';
                  ]]]
              icon: |
                [[[
                  return variables.pause_mode === 'continue'
                    || variables.pause_mode === 'continue_dock'
                    ? 'mdi:play' : 'mdi:pause';
                ]]]
              name: |
                [[[
                  return variables.pause_mode === 'continue'
                    || variables.pause_mode === 'continue_dock'
                    ? 'Continue' : 'Pause';
                ]]]
              tap_action:
                action: |
                  [[[ return variables.pause_mode !== 'inactive' ? 'call-service' : 'none' ]]]
                service: script.vacuum_pause_resume
                service_data:
                  vacuum_entity: 'vacuum.[[vacuum]]'
            - type: custom:button-card
              template: vacuum_control_button
              icon: mdi:skip-next
              name: Skip
              tap_action:
                action: call-service
                service: script.vacuum_skip_room
                service_data:
                  vacuum_entity: 'vacuum.[[vacuum]]'
            - type: custom:button-card
              template: vacuum_control_button
              icon: mdi:stop
              name: Stop
              variables:
                tone: var(--error-color)
              tap_action:
                action: call-service
                service: script.vacuum_stop_sequence
                service_data:
                  vacuum_entity: 'vacuum.[[vacuum]]'

      # ---- selection mode ----
      - type: conditional
        conditions:
        - condition: state
          entity: 'input_boolean.[[vacuum]]_sequence_running'
          state: 'off'
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            template: vacuum_idle_header
            variables:
              vacuum: '[[vacuum]]'
              floor: '[[floor]]'
              accent: '[[color]]'

          # Passes: label + segmented control, sized to content
          - type: grid
            columns: 2
            square: false
            card_mod:
              style:
                .: |
                  #root {
                    display: flex !important;
                    align-items: center !important;
                    gap: 10px !important;
                    padding: 0 18px 12px !important;
                  }
                  #root > * { width: auto !important; flex: 0 0 auto !important; }
            cards:
            - type: custom:button-card
              show_icon: false
              show_state: false
              name: Passes
              tap_action:
                action: none
              styles:
                card:
                - padding: 0
                - background: none
                - border: none
                name:
                - font-size: 12px
                - white-space: nowrap
                - color: var(--secondary-text-color)
              card_mod:
                style: *theme_button_style
            - type: grid
              columns: 2
              square: false
              card_mod:
                style:
                  .: |
                    #root {
                      display: flex !important;
                      gap: 0 !important;
                      padding: 2px !important;
                      border-radius: 8px;
                      background: color-mix(in srgb, var(--primary-text-color) 6%, transparent);
                    }
                    #root > * { width: auto !important; flex: 0 0 auto !important; }
              cards:
              - type: custom:button-card
                template: vacuum_pass_segment
                variables:
                  vacuum: '[[vacuum]]'
                  passes: 1
                  color: '[[color]]'
              - type: custom:button-card
                template: vacuum_pass_segment
                variables:
                  vacuum: '[[vacuum]]'
                  passes: 2
                  color: '[[color]]'

          # Empty mode: label + segmented control
          - type: grid
            columns: 2
            square: false
            card_mod:
              style:
                .: |
                  #root {
                    display: flex !important;
                    align-items: center !important;
                    gap: 10px !important;
                    padding: 0 18px 12px !important;
                  }
                  #root > * { width: auto !important; flex: 0 0 auto !important; }
            cards:
            - type: custom:button-card
              show_icon: false
              show_state: false
              name: Empty
              tap_action:
                action: none
              styles:
                card:
                - padding: 0
                - background: none
                - border: none
                name:
                - font-size: 12px
                - white-space: nowrap
                - color: var(--secondary-text-color)
              card_mod:
                style: *theme_button_style
            - type: grid
              columns: 2
              square: false
              card_mod:
                style:
                  .: |
                    #root {
                      display: flex !important;
                      gap: 0 !important;
                      padding: 2px !important;
                      border-radius: 8px;
                      background: color-mix(in srgb, var(--primary-text-color) 6%, transparent);
                    }
                    #root > * { width: auto !important; flex: 0 0 auto !important; }
              cards:
              - type: custom:button-card
                template: vacuum_empty_mode_segment
                variables:
                  vacuum: '[[vacuum]]'
                  mode: each_room
                  color: '[[color]]'
              - type: custom:button-card
                template: vacuum_empty_mode_segment
                variables:
                  vacuum: '[[vacuum]]'
                  mode: end_only
                  color: '[[color]]'

          # Mop after vacuum toggle — only shows for vacuums that have
          # the mop_after_vacuum helper. The conditional gates
          # on the entity having a real state (on/off), so vacuums
          # without the helper just don't render this row.
          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: 'input_boolean.[[vacuum]]_mop_after_vacuum'
                state: 'on'
              - condition: state
                entity: 'input_boolean.[[vacuum]]_mop_after_vacuum'
                state: 'off'
            card:
              type: grid
              columns: 2
              square: false
              card_mod:
                style:
                  .: |
                    #root {
                      display: flex !important;
                      align-items: center !important;
                      gap: 10px !important;
                      padding: 0 18px 12px !important;
                    }
                    #root > * { width: auto !important; flex: 0 0 auto !important; }
              cards:
              - type: custom:button-card
                show_icon: false
                show_state: false
                name: Mop After
                tap_action:
                  action: none
                styles:
                  card:
                  - padding: 0
                  - background: none
                  - border: none
                  name:
                  - font-size: 12px
                  - white-space: nowrap
                  - color: var(--secondary-text-color)
                card_mod:
                  style: *theme_button_style
              - type: grid
                columns: 2
                square: false
                card_mod:
                  style:
                    .: |
                      #root {
                        display: flex !important;
                        gap: 0 !important;
                        padding: 2px !important;
                        border-radius: 8px;
                        background: color-mix(in srgb, var(--primary-text-color) 6%, transparent);
                      }
                      #root > * { width: auto !important; flex: 0 0 auto !important; }
                cards:
                - type: custom:button-card
                  template: vacuum_mop_toggle_segment
                  variables:
                    vacuum: '[[vacuum]]'
                    mode: 'off'
                    color: '[[color]]'
                - type: custom:button-card
                  template: vacuum_mop_toggle_segment
                  variables:
                    vacuum: '[[vacuum]]'
                    mode: 'on'
                    color: '[[color]]'

          # Presets
          - type: grid
            columns: 2
            square: false
            card_mod:
              style:
                .: |
                  #root {
                    display: flex !important;
                    gap: 6px !important;
                    padding: 0 18px 12px !important;
                  }
                  #root > * { width: auto !important; flex: 0 0 auto !important; }
            cards:
            - type: custom:button-card
              template: vacuum_preset_chip
              name: Large Rooms
              variables:
                vacuum: '[[vacuum]]'
                rooms: large
                color: '[[color]]'
            - type: custom:button-card
              template: vacuum_preset_chip
              name: Small Rooms
              variables:
                vacuum: '[[vacuum]]'
                rooms: small
                color: '[[color]]'
            - type: custom:button-card
              template: vacuum_preset_chip
              name: All Rooms
              variables:
                vacuum: '[[vacuum]]'
                rooms: all
                color: '[[color]]'

          # Room chips, generated from sensor.[[vacuum]]_room_config so segment
          # ids live in packages/vacuum_rooms.jinja and nowhere else —
          # adding a room to that macro makes a chip appear here.
          - type: custom:auto-entities
            card_mod:
              style:
                hui-grid-card$: |
                  #root {
                    display: flex !important;
                    flex-wrap: wrap !important;
                    gap: 7px !important;
                    padding: 0 18px 14px !important;
                  }
                  #root > * { width: auto !important; flex: 0 0 auto !important; }
            card:
              type: grid
              columns: 3
              square: false
            card_param: cards
            filter:
              template: |
                {% set ns = namespace(cards=[]) %}
                {% for room in state_attr('sensor.[[vacuum]]_room_config', 'rooms') or [] %}
                  {% set ns.cards = ns.cards + [
                    {
                      'type': 'custom:button-card',
                      'template': 'vacuum_room_chip',
                      'variables': {
                        'vacuum': '[[vacuum]]',
                        'room_id': room.id,
                        'color': '[[color]]',
                        'color_end': '[[color_end]]'
                      }
                    }
                  ] %}
                {% endfor %}
                {{ ns.cards }}

          - type: grid
            columns: 1
            square: false
            card_mod:
              style:
                .: |
                  #root { padding: 0 18px 16px !important; }
            cards:
            - type: custom:button-card
              template: vacuum_start_button
              variables:
                vacuum: '[[vacuum]]'
                color: '[[color]]'
                color_end: '[[color_end]]'
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 1
  card_mod:
    style: ''
  sections:
  - type: grid
    column_span: 1
    cards:
    - *id001
  - type: grid
    column_span: 1
    cards:
    - type: custom:mushroom-title-card
      title: Home
      card_mod:
        style: *theme_exempt_style
    # Only promote during the set window
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.<entity_3>s_door_door
        state: 'on'
      - condition: state
        entity: schedule.cond_bedtime_doors
        state: 'on'
      card:
        type: custom:button-card
        template: promoted_chip
        entity: binary_sensor.<entity_3>s_door_door
        name: "<entity_3>'s Door Open"
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.<entity_4>s_door_door
        state: 'on'
      - condition: state
        entity: schedule.cond_bedtime_doors
        state: 'on'
      card:
        type: custom:button-card
        template: promoted_chip
        entity: binary_sensor.<entity_4>s_door_door
        name: "<entity_4>'s Door Open"
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.basement_area_basement_door_door
        state: 'on'
      card:
        type: custom:button-card
        template: promoted_chip
        entity: binary_sensor.basement_area_basement_door_door
        name: "Basement Door Open"
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.garage_house_garage_door_door
        state: 'on'
      card:
        type: custom:button-card
        template: promoted_chip
        entity: binary_sensor.garage_house_garage_door_door
        name: "Garage Door Open"
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.soil_moisture_sensor_soil_moisture
        below: input_number.soil_moisture_minimum
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.soil_moisture_sensor_soil_moisture
        icon: mdi:water-percent
        name: |
          [[[
            const m = Math.round(parseFloat(entity.state));
            return `Soil Moisture ${m}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.soil_moisture_sensor_battery
        below: 11
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.soil_moisture_sensor_battery
        icon: mdi:battery-low
        name: |
          [[[
            const b = Math.round(parseFloat(entity.state));
            return `Soil Sensor Battery ${b}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.<entity_3>_s_door_battery
        below: 11
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.<entity_3>_s_door_battery
        icon: mdi:battery-low
        name: |
          [[[
            const b = Math.round(parseFloat(entity.state));
            return `<entity_3>'s Door Battery ${b}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.<entity_4>s_door_battery
        below: 11
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.<entity_4>s_door_battery
        icon: mdi:battery-low
        name: |
          [[[
            const b = Math.round(parseFloat(entity.state));
            return `<entity_4>'s Door Battery ${b}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.basement_area_basement_door_battery
        below: 11
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.basement_area_basement_door_battery
        icon: mdi:battery-low
        name: |
          [[[
            const b = Math.round(parseFloat(entity.state));
            return `Basement Door Battery ${b}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.garage_house_garage_door_battery
        below: 11
      card:
        type: custom:button-card
        template: promoted_chip
        entity: sensor.garage_house_garage_door_battery
        icon: mdi:battery-low
        name: |
          [[[
            const b = Math.round(parseFloat(entity.state));
            return `Garage Door Battery ${b}%`;
          ]]]
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.dashboard_notifications
        state_not: '0'
      card:
        type: custom:stack-in-card
        mode: vertical
        card_mod:
          style:
            .: *theme_card_style
            hui-vertical-stack-card$: |
              #root > * {
                margin: 0 !important;
                --ha-card-border-width: 0 !important;
              }
        cards:
        - type: custom:button-card
          entity: sensor.dashboard_notifications
          show_name: false
          show_state: false
          show_icon: false
          tap_action:
            action: call-service
            service: input_boolean.toggle
            service_data:
              entity_id: |
                [[[
                  return user.name === '<entity_31>'
                    ? 'input_boolean.notification_expanded_<entity_31>'
                    : 'input_boolean.notification_expanded_<entity_32>';
                ]]]
          custom_fields:
            dots: |
              [[[
                const items = (entity.attributes.items || []).filter(i => i.active && !i.promoted);
                if (!items.length) return '';

                // Severity colors from theme CSS variables — same source as
                // the notification list, keeping dots and list in sync.
                const colors = {
                  red: 'var(--error-color)',
                  amber: 'var(--warning-color)',
                  blue: 'var(--info-color)',
                  green: 'var(--success-color)'
                };
                const order = ['red', 'amber', 'blue', 'green'];
                const expandedEntity = user.name === '<entity_31>'
                  ? 'input_boolean.notification_expanded_<entity_31>'
                  : 'input_boolean.notification_expanded_<entity_32>';
                const expanded = states[expandedEntity]?.state === 'on';
                const chevron = expanded ? 'mdi:chevron-up' : 'mdi:chevron-down';
                let out = '<div style="display:flex;flex-direction:column;gap:3px;">';

                for (const sev of order) {
                  const count = items.filter(i => i.severity === sev).length;
                  if (!count) continue;

                  // Subtle glow on urgent (red/amber) dots for visual emphasis.
                  // Uses color-mix for opacity since the color is a CSS variable.
                  const glow = (sev === 'red' || sev === 'amber')
                    ? `box-shadow:0 0 4px color-mix(in srgb, ${colors[sev]} 25%, transparent);` : '';
                  out += '<div style="display:flex;flex-wrap:wrap;gap:3px;">';
                  const visible = Math.min(count, 30);

                  for (let i = 0; i < visible; i++) {
                    out += `<div style="width:6px;height:6px;border-radius:50%;background:${colors[sev]};${glow}"></div>`;
                  }

                  if (count > 30) out += `<span style="font-size:10px;color:var(--secondary-text-color);">+${count-30}</span>`;
                  out += '</div>';
                }

                out += `<div style="display:flex;justify-content:flex-end;align-items:center;margin-top:2px;">`;
                out += `<ha-icon icon="${chevron}" style="--mdc-icon-size:16px;color:var(--secondary-text-color);"></ha-icon>`;
                out += '</div></div>';

                return out;
              ]]]
          styles:
            card:
            - padding: 8px 12px
            - background: none
            - box-shadow: none
            - border: none
            grid:
            - grid-template-areas: '"dots"'
          card_mod:
            style: *theme_exempt_style
        - type: conditional
          conditions:
          - condition: user
            users:
            - 760...94c
          - condition: state
            entity: input_boolean.notification_expanded_<entity_32>
            state: 'on'
          card: &expanded_notification_list
            type: custom:button-card
            template: notification_list
            variables:
              filter_active: true
              show_limit: 10
              show_overflow: true
            card_mod:
              style: *theme_exempt_style
        - type: conditional
          conditions:
          - condition: user
            users:
            - f47...c86
          - condition: state
            entity: input_boolean.notification_expanded_<entity_31>
            state: 'on'
          card: *expanded_notification_list
  - type: grid
    column_span: 1
    cards:
    - type: custom:stack-in-card
      mode: vertical
      card_mod:
        style:
          .: *theme_card_style
          hui-vertical-stack-card$: |
            #root > * {
              margin: 0 !important;
              --ha-card-border-width: 0 !important;
            }
      cards:
      - type: custom:button-card
        entity: sensor.<entity_10>_temperature
        show_name: false
        show_state: false
        show_icon: false
        tap_action:
          action: call-service
          service: input_boolean.toggle
          service_data:
            entity_id: input_boolean.weather_expanded
        custom_fields:
          weather_summary: |
            [[[
              const temp = Math.round(parseFloat(entity.state));
              const feels = Math.round(parseFloat(states['sensor.<entity_10>_feels_like'].state));
              const humidity = parseFloat(states['sensor.backyard_absolute_humidity'].state).toFixed(1);
              const expanded = states['input_boolean.weather_expanded']?.state === 'on';
              const chevron = expanded ? 'mdi:chevron-up' : 'mdi:chevron-down';
              return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
                <div style="display:flex;gap:16px;align-items:baseline;">
                  <span style="font-size:1.1em;font-weight:500;">${temp}°</span>
                  <span style="color:var(--secondary-text-color);font-size:0.9em;">Feels ${feels}°</span>
                  <span style="color:var(--secondary-text-color);font-size:0.9em;">Humidity ${humidity} g/m³</span>
                </div>
                <ha-icon icon="${chevron}" style="--mdc-icon-size:20px;color:var(--secondary-text-color);"></ha-icon>
              </div>`;
            ]]]
        styles:
          card:
          - padding: 12px 16px
          - background: none
          - box-shadow: none
          - border: none
          grid:
          - grid-template-areas: '"weather_summary"'
        card_mod:
          style: *theme_exempt_style
      - type: conditional
        conditions:
        - condition: state
          entity: input_boolean.weather_expanded
          state: 'on'
        card:
          type: custom:weather-forecast-card
          entity: weather.forecast_home
          default_forecast: daily
          current:
            temperature_entity: sensor.<entity_10>_temperature
            temperature_precision: 0
            show_attributes:
            - name: apparent_temperature
              entity: sensor.<entity_10>_feels_like
          forecast:
            mode: chart
            extra_attribute: wind_bearing
            hourly_group_size: 2
          card_mod:
            style:
              .: *theme_card_transparent
              $: |
                .wfc-current-secondary-info {
                  display: none !important;
                }
                .wfc-current-attribute:nth-child(1) .wfc-current-attribute-name {
                  font-size: 0;
                }
                .wfc-current-attribute:nth-child(1) .wfc-current-attribute-name::after {
                  content: "Feels Like";
                  font-size: var(--ha-font-size-m, 14px);
                }
                .wfc-current-weather {
                  background: rgba(var(--rgb-primary-text-color), 0.05);
                  margin: -16px -16px 0;
                  padding: 12px 16px 4px;
                }
      - type: conditional
        conditions:
        - condition: state
          entity: input_boolean.weather_expanded
          state: 'on'
        card:
          type: custom:apexcharts-card
          header:
            show: true
            title: Absolute humidity
            show_states: true
          graph_span: 24h
          span:
            end: hour
          yaxis:
          - decimals: 0
            apex_config:
              tickAmount: 4
              labels:
                show: true
          apex_config:
            chart:
              height: 130
            stroke:
              curve: smooth
              width: 2
            fill:
              type: gradient
              gradient:
                opacityFrom: 0.45
                opacityTo: 0.05
            grid:
              show: true
              borderColor: rgba(128, 128, 128, 0.2)
            legend:
              show: false
            xaxis:
              type: datetime
              tickAmount: 5
              labels:
                showDuplicates: false
                formatter: |
                  EVAL:function(val, timestamp, opts) {
                    const i = opts.i;
                    const n = opts.w.globals.labels.length;
                    const step = Math.max(1, Math.round((n - 1) / 5));
                    if (i % step !== 0 && i !== n - 1) return '';
                    return new Date(val).toLocaleTimeString('en-US', {
                      hour: 'numeric',
                      hour12: true,
                    });
                  }
          series:
          - entity: sensor.backyard_absolute_humidity
            name: Absolute humidity
            type: area
            color: var(--primary-color)
            show:
              name_in_header: false
            group_by:
              func: avg
              duration: 1h
          card_mod:
            style: |
              {% from 'general_home_theme.jinja' import theme_css %}
              {{ theme_css(user, 'exempt') }}
              ha-card {
                margin-top: -8px;
                padding-top: 0 !important;
              }
              .apexcharts-xaxis text {
                font-size: 10px !important;
              }
              .apexcharts-area-series path[stroke] {
                stroke: var(--primary-color) !important;
              }
              .apexcharts-area-series path[fill^="url"] {
                fill: var(--primary-color) !important;
                opacity: 0.15;
              }
              .apexcharts-area-series path[fill]:not([fill^="url"]):not([fill="none"]) {
                fill: var(--primary-color) !important;
              }
  - type: grid
    column_span: 1
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.dashboard_conditional_visible
        state_not: '0'
      - condition: state
        entity: binary_sensor.house_armed_card_visible
        state: 'on'
      card: &cond_card_house_armed
        type: custom:stack-in-card
        mode: vertical
        card_mod:
          style:
            .: *theme_card_style
            hui-vertical-stack-card$: |
              #root > * {
                margin: 0 !important;
                --ha-card-border-width: 0 !important;
              }
        cards:
        - type: custom:mushroom-title-card
          title: House Security
          icon: mdi:shield-home
          card_mod:
            style: *theme_exempt_style
        - type: entities
          entities:
          - entity: input_boolean.house_armed
            name: Arm House
            icon: mdi:shield-lock
            secondary_info: last-changed
          - type: section
            label: Alerts when armed
          - entity: binary_sensor.basement_area_basement_door_door
            name: Basement Door
            icon: mdi:door
            secondary_info: last-changed
            state_color: true
          - entity: binary_sensor.garage_house_garage_door_door
            name: Garage Door
            icon: mdi:door
            secondary_info: last-changed
            state_color: true
          - entity: binary_sensor.<entity_5>s_room_<entity_5>s_door_door
            name: <entity_5>'s Door
            icon: mdi:door
            secondary_info: last-changed
            state_color: true
          - type: section
            label: Monitor only
          - entity: binary_sensor.<entity_3>s_door_door
            name: <entity_3>'s Door
            icon: mdi:door
            secondary_info: last-changed
            state_color: true
          - entity: binary_sensor.<entity_4>s_door_door
            name: <entity_4>'s Door
            icon: mdi:door
            secondary_info: last-changed
            state_color: true
          card_mod:
            style: |
              {% from 'general_home_theme.jinja' import theme_css %}
              {{ theme_css(user, 'card') }}
              :host {
                --state-binary_sensor-active-color:
                  var(--error-color);
                --state-binary_sensor-inactive-color:
                  var(--success-color);
              }
    - type: conditional
      conditions:
      - condition: state
        entity: schedule.cond_uv_index
        state: 'on'
      card: &cond_card_uv_index
        type: custom:apexcharts-card
        experimental:
          color_threshold: true
        header:
          title: UV Index Today
          show: true
          show_states: true
          colorize_states: true
        graph_span: 12h
        span:
          start: day
          offset: +7h
        now:
          show: true
        yaxis:
        - min: 0
          max: ~12
          apex_config:
            tickAmount: 4
        apex_config:
          chart:
            height: 180
          stroke:
            opacity: 1
          fill:
            opacity:
            - 0
            - 0
            - 0.7
          annotations:
            yaxis:
            - y: 0
              y2: 3
              fillColor: *uv_green
              opacity: 0.1
              label:
                text: Low
                borderWidth: 0
                style:
                  fontSize: 10px
                  background: transparent
                  color: '#9E9E9E'
                  padding:
                    left: 0
                    right: 0
                    top: 0
                    bottom: 0
            - y: 3
              y2: 6
              fillColor: *uv_amber
              opacity: 0.1
              label:
                text: Moderate
                borderWidth: 0
                style:
                  fontSize: 10px
                  background: transparent
                  color: '#9E9E9E'
                  padding:
                    left: 0
                    right: 0
                    top: 0
                    bottom: 0
            - y: 6
              y2: 8
              fillColor: *uv_orange
              opacity: 0.1
              label:
                text: High
                borderWidth: 0
                style:
                  fontSize: 10px
                  background: transparent
                  color: '#9E9E9E'
                  padding:
                    left: 0
                    right: 0
                    top: 0
                    bottom: 0
            - y: 8
              y2: 15
              fillColor: *uv_red
              opacity: 0.1
              label:
                text: Very High
                borderWidth: 0
                style:
                  fontSize: 10px
                  background: transparent
                  color: '#9E9E9E'
                  padding:
                    left: 0
                    right: 0
                    top: 0
                    bottom: 0
        series:
        - entity: sensor.openmeteo_hourly_uv_forecast
          name: Forecast
          type: area
          color: '#03A9F4'
          opacity: 0
          stroke_width: 2
          stroke_dash: 6
          unit: ' '
          show:
            in_header: raw
            legend_value: false
          data_generator: |
            return entity.attributes.time
              .map((t, i) => [new Date(t).getTime(), entity.attributes.uv_index[i]])
              .filter((p) => p[0] >= start.getTime() && p[0] <= end.getTime());
        - entity: sensor.<entity_10>_uv_index
          name: Current
          unit: ' '
          color: *uv_orange
          show:
            in_header: true
            in_chart: false
        - entity: sensor.<entity_10>_uv_index
          name: Actual
          type: area
          color: *uv_orange
          stroke_width: 0
          extend_to: now
          unit: ' '
          color_threshold:
            - value: 0
              color: *uv_green
            - value: 3
              color: *uv_amber
            - value: 6
              color: *uv_orange
            - value: 8
              color: *uv_red
          show:
            in_header: false
            legend_value: false
          group_by:
            func: avg
            duration: 30min
