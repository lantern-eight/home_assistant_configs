# =============================================================================
# Registry Metadata — Categories & Labels for General Home Mobile
# =============================================================================
# Copy to registry_metadata.yaml and fill in your HA values.
# Applied by the sync script with -c flag:
#   uv run python scripts/ha_sync.py -c
#
# Dashboard-specific labels and categories for entities that are owned by
# this dashboard (helpers, theme inputs, conditional card toggles, etc.).
# General-purpose labels go in the repo-root registry_metadata.yaml instead.
#
# =============================================================================

categories:
  GenMobile Dashboard Notifications:
    scope: helpers
    icon: mdi:bell
  GenMobile Theme System:
    scope: helpers
    icon: mdi:palette

labels:
  gm-dashboard:
    color: blue
    icon: mdi:cellphone
  gm-per-user:
    color: grey
    icon: mdi:account-multiple
  gm-theme:
    color: purple
    icon: mdi:palette
  gm-conditional-cards:
    color: orange
    icon: mdi:cards
  gm-notifications:
    color: red
    icon: mdi:bell-ring
  gm-theme-preferences:
    color: purple
    icon: mdi:palette-swatch-variant
  gm-theme-customization:
    color: purple
    icon: mdi:tune-variant

entities:
  # --- Per-user theme preferences (mode, style, palette) ---
  input_select.theme_mode_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences
  input_select.theme_mode_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences
  input_select.theme_style_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences
  input_select.theme_style_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences
  input_select.theme_palette_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences
  input_select.theme_palette_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-preferences

  # --- Per-user theme customization (background, opacity, blur) ---
  input_text.theme_background_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization
  input_text.theme_background_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization
  input_number.theme_card_opacity_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization
  input_number.theme_card_opacity_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization
  input_number.theme_card_blur_<user1>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization
  input_number.theme_card_blur_<user2>:
    category: GenMobile Theme System
    labels:
      - gm-dashboard
      - gm-per-user
      - gm-theme
      - gm-theme-customization

  # --- Conditional card toggles ---
  schedule.cond_bedtime_doors:
    category: GenMobile Dashboard Notifications
    labels:
      - gm-dashboard
      - gm-conditional-cards
  schedule.cond_uv_index:
    category: GenMobile Dashboard Notifications
    labels:
      - gm-dashboard
      - gm-conditional-cards

  # --- Notification state (one per user) ---
  input_boolean.notification_expanded_<user1>:
    category: GenMobile Dashboard Notifications
    labels:
      - gm-dashboard
      - gm-notifications
  input_boolean.notification_expanded_<user2>:
    category: GenMobile Dashboard Notifications
    labels:
      - gm-dashboard
      - gm-notifications
