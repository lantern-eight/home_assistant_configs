# =============================================================================
# General Home Mobile — Template Sensors
# =============================================================================
# Synced to HA as: template_sensors/general_home_sensors.yaml
# Requires HA restart after changes.
#
# Conditional Card Priority System
# ---------------------------------
# Each conditional card has:
#   - An input_boolean (is the card's trigger condition active?)
#   - A priority (1 = highest, 100 = lowest) — evaluated dynamically
#
# The template sensor below reads all card booleans, calculates dynamic
# priorities, sorts, and outputs the top 5 as the "visible" set.
# Dashboard conditional cards check this sensor to show/hide.
#
# To add a new conditional card:
#   1. Create input_boolean.cond_<card_id> in HA helpers
#   2. Add an automation to toggle it based on conditions
#   3. Add the card entry to the `cards` list below with id, boolean, and
#      priority template
#   4. Add the conditional card in dashboard.yaml
#   5. Add the entity to this sensor's trigger block
# =============================================================================

- trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id:
        - input_boolean.house_armed
        - binary_sensor.house_armed_card_visible
        - schedule.cond_bedtime_doors
        - schedule.cond_uv_index
        - sensor.<entity_10>_uv_index
    - platform: time
      at:
        - "05:00:00"
        - "22:00:00"
  sensor:
    # -------------------------------------------------------------------------
    # Conditional card visibility manager
    # -------------------------------------------------------------------------
    - name: "Dashboard Conditional Visible"
      unique_id: dashboard_conditional_visible
      icon: mdi:cards
      state: >
        {% set max_visible = 5 %}
        {% set cards = [
          {
            'id': 'house_armed',
            'active': is_state(
               'binary_sensor.house_armed_card_visible', 'on'),
            'priority': 5
               if is_state('input_boolean.house_armed', 'on')
               else (10 if (now().hour >= 22 or now().hour < 5)
               else 30)
          },
          {
            'id': 'uv_index',
            'active': is_state('schedule.cond_uv_index', 'on'),
            'priority': 15 if states('sensor.<entity_10>_uv_index') | float(0) >= 6 else 40
          }
        ] %}
        {% set active = cards | selectattr('active') | sort(attribute='priority') | list %}
        {{ active[:max_visible] | length }}

# Room light toggles (Rooms pop-up)
# ---------------------------------
# Uses HA area assignments. Pop-up room → area ID (from entity discovery)

- switch:
    - name: "Basement Lights"
      unique_id: room_lights_basement
      icon: mdi:lightbulb
      availability: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('basement') | from_json | length > 0 }}
      state: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('basement') | from_json
           | select('is_state', 'on') | list | length > 0 }}
      turn_on:
        - action: light.turn_on
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('basement') | from_json | list }}
      turn_off:
        - action: light.turn_off
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('basement') | from_json | list }}

    - name: "Main Suite Lights"
      unique_id: room_lights_main_suite
      icon: mdi:lightbulb
      availability: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('main_suite', 'utility_light') | from_json | length > 0 }}
      state: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('main_suite', 'utility_light') | from_json
           | select('is_state', 'on') | list | length > 0 }}
      turn_on:
        - action: light.turn_on
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('main_suite', 'utility_light') | from_json | list }}
      turn_off:
        - action: light.turn_off
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('main_suite', 'utility_light') | from_json | list }}

    - name: "Kitchen Lights"
      unique_id: room_lights_kitchen
      icon: mdi:lightbulb
      availability: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('kitchen') | from_json | length > 0 }}
      state: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('kitchen') | from_json
           | select('is_state', 'on') | list | length > 0 }}
      turn_on:
        - action: light.turn_on
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('kitchen') | from_json | list }}
      turn_off:
        - action: light.turn_off
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('kitchen') | from_json | list }}

    - name: "<entity_4>s Room Lights"
      unique_id: room_lights_<entity_4>_s_room
      icon: mdi:lightbulb
      availability: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('<entity_4>_s_room') | from_json | length > 0 }}
      state: >
        {% from 'room_lights.jinja' import room_lights %}
        {{ room_lights('<entity_4>_s_room') | from_json
           | select('is_state', 'on') | list | length > 0 }}
      turn_on:
        - action: light.turn_on
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('<entity_4>_s_room') | from_json | list }}
      turn_off:
        - action: light.turn_off
          target:
            entity_id: >
              {% from 'room_lights.jinja' import room_lights %}
              {{ room_lights('<entity_4>_s_room') | from_json | list }}

# =============================================================================
# Notification System — Dashboard Header Bar (trigger-based)
# =============================================================================
# Aggregates transient status items into a single sensor for the notification
# header. Evaluates only when monitored entities change or once per minute.
# Items are computed once in the action block; state derives from items.
# Items attribute drives the dot counter and expanded list via button-card
# JS templates.
# =============================================================================

- trigger:
    - platform: homeassistant
      event: start
    # Doors
    - platform: state
      entity_id:
        - binary_sensor.<entity_3>s_door_door
        - binary_sensor.<entity_4>s_door_door
        - binary_sensor.basement_area_basement_door_door
        - binary_sensor.garage_house_garage_door_door
    # Door batteries
    - platform: state
      entity_id:
        - sensor.<entity_3>_s_door_battery
        - sensor.<entity_4>s_door_battery
        - sensor.basement_area_basement_door_battery
        - sensor.garage_house_garage_door_battery
    # Vacuums
    - platform: state
      entity_id:
        - binary_sensor.<entity_34>_cleaning
        - binary_sensor.<entity_35>_cleaning
        - sensor.<entity_34>_cleaning_progress
        - sensor.<entity_35>_cleaning_progress
    # Printers
    - platform: state
      entity_id:
        - sensor.<entity_23>_current_status
        - sensor.<entity_22>_current_status
        - sensor.<entity_23>_percent_complete
        - sensor.<entity_22>_percent_complete
        - sensor.<entity_23>_remaining_print_time
        - sensor.<entity_22>_remaining_print_time
    # HVAC
    - platform: state
      entity_id: climate.living_room_thermostat
      attribute: hvac_action
    # Power plug
    - platform: numeric_state
      entity_id: sensor.<entity_33>_power_top
      above: 0
    - platform: numeric_state
      entity_id: sensor.<entity_33>_power_top
      below: 1
    # Weather alerts
    - platform: state
      entity_id: sensor.house_nws_alerts_<entity_24>_nws_alerts_alerts
    # Lightning
    - platform: state
      entity_id:
        - sensor.<entity_10>_lightning_count
        - sensor.<entity_10>_lightning_average_distance
    # Soil moisture
    - platform: state
      entity_id:
        - sensor.soil_moisture_sensor_moisture
        - sensor.soil_moisture_sensor_battery
        - input_number.soil_moisture_minimum
    # Lawn rain
    - platform: state
      entity_id: sensor.lawn_rain_weekly
    # Periodic: light count, season check, power wattage display
    - platform: time_pattern
      minutes: "/1"
  action:
    - variables:
        notification_items: >
          {% set ns = namespace(items=[]) %}

          {# --- Doors: loop generates one notification item per door.
               promote_anytime: true = chip appears whenever open;
               false = chip only appears during the specified window --- #}
          {% set night_time_window =
            is_state('schedule.cond_bedtime_doors', 'on') %}
          {% set door_configs = [
            {
              'entity': 'binary_sensor.<entity_3>s_door_door',
              'id': 'door_<entity_3>',
              'label': "<entity_3>'s Door",
              'sort_key': '0_door_<entity_3>',
              'promote_anytime': false
            },
            {
              'entity': 'binary_sensor.<entity_4>s_door_door',
              'id': 'door_<entity_4>',
              'label': "<entity_4>'s Door",
              'sort_key': '0_door_<entity_4>',
              'promote_anytime': false
            },
            {
              'entity':
                'binary_sensor.basement_area_basement_door_door',
              'id': 'door_basement',
              'label': 'Basement Door',
              'sort_key': '0_door_basement',
              'promote_anytime': true
            },
            {
              'entity':
                'binary_sensor.garage_house_garage_door_door',
              'id': 'door_garage',
              'label': 'Garage Door',
              'sort_key': '0_door_garage',
              'promote_anytime': true
            }
          ] %}
          {% for door in door_configs %}
            {% set is_open = is_state(door.entity, 'on') %}
            {% set should_promote = is_open and
              (door.promote_anytime or night_time_window) %}
            {% set ns.items = ns.items + [
              {
                'id': door.id,
                'active': is_open,
                'label': door.label
                   ~ (' Open' if is_open else ''),
                'icon': 'mdi:door-open'
                   if is_open else 'mdi:door-closed',
                'severity': 'red' if is_open else 'green',
                'promoted': should_promote,
                'sort_key': door.sort_key
              }
            ] %}
          {% endfor %}

          {% set nws_alerts = state_attr(
             'sensor.house_nws_alerts_<entity_24>_nws_alerts_alerts', 'Alerts') %}
          {% if nws_alerts is not none %}
            {% set nws_icons = {
              'EHW': 'mdi:thermometer-alert',
              'HTA': 'mdi:thermometer-alert',
              'XHW': 'mdi:thermometer-alert',
              'TOR': 'mdi:weather-tornado',
              'TOA': 'mdi:weather-tornado',
              'FFW': 'mdi:home-flood',
              'FFA': 'mdi:home-flood',
              'FLW': 'mdi:home-flood',
              'FLA': 'mdi:home-flood',
              'SVR': 'mdi:weather-lightning',
              'SVA': 'mdi:weather-lightning',
              'WSW': 'mdi:snowflake-alert',
              'WSA': 'mdi:snowflake-alert',
              'BZW': 'mdi:snowflake-alert',
              'WCW': 'mdi:snowflake-alert',
              'WCA': 'mdi:snowflake-alert'
            } %}
            {% set nws_sevs = {
              'Extreme': 'red',
              'Severe': 'amber',
              'Moderate': 'blue',
              'Minor': 'blue'
            } %}

            {% for alert in nws_alerts %}
              {% set code = alert.NWSCode | default('UNK') %}
              {% set end_str = (alert.Ends | default('')) or (alert.Expires | default('')) %}
              {% set end_dt = (end_str | as_datetime) if end_str else none %}
              {% set delta = (((end_dt - now()).total_seconds()) | int) if end_dt else -1 %}

              {% set d = (delta / 86400) | int %}
              {% set h = ((delta % 86400) / 3600) | int %}
              {% set m = ((delta % 3600) / 60) | int %}
              {% set tr = (d ~ 'd ' ~ h ~ 'h left') if d > 0
                     else ((h ~ 'h ' ~ m ~ 'm left') if h > 0
                     else (m ~ 'm left')) %}
              {% set tr = tr if delta > 0 else '' %}

              {% set icon = nws_icons[code]
                 if code in nws_icons
                 else 'mdi:weather-lightning-rainy' %}
              {% set sev = nws_sevs[alert.Severity]
                 if alert.Severity is defined and alert.Severity in nws_sevs
                 else 'blue' %}

              {% set ns.items = ns.items + [
                {
                  'id': 'nws_' ~ code ~ '_' ~ loop.index,
                  'active': true,
                  'label': alert.Event | default('Weather Alert'),
                  'icon': icon,
                  'severity': sev,
                  'promoted': false,
                  'sort_key': '0_weather_' ~ code,
                  'time_remaining': tr
                }
              ] %}
            {% endfor %}
          {% endif %}

          {% set lightning_count = states('sensor.<entity_10>_lightning_count') | int(0) %}
          {% set lightning_dist = states('sensor.<entity_10>_lightning_average_distance')
             | float(0) | round(1) %}
          {% set lightning_label = lightning_count | string
             ~ ' Lightning Strike'
             ~ ('s' if lightning_count != 1 else '')
             ~ ' (~' ~ lightning_dist | string ~ ' mi)' %}
          {% set ns.items = ns.items + [
            {
              'id': 'lightning',
              'active': lightning_count > 0,
              'label': lightning_label,
              'icon': 'mdi:weather-lightning',
              'severity': 'amber' if lightning_count > 0 else 'green',
              'promoted': false,
              'sort_key': '1_lightning'
            }
          ] %}

          {% set in_lawn_rain_season = now().month >= 3 and now().month <= 9 %}
          {% set lawn_rain_this_week = states('sensor.lawn_rain_weekly')
             | float(0) | round(2) %}
          {% set lawn_rain_last_week = state_attr('sensor.lawn_rain_weekly', 'last_period')
             | float(0) | round(2) %}
          {% set lawn_rain_label = 'Lawn Rain: '
             ~ lawn_rain_this_week ~ 'in | Last Week: '
             ~ lawn_rain_last_week ~ 'in' %}
          {% set ns.items = ns.items + [
            {
              'id': 'lawn_rain',
              'active': in_lawn_rain_season,
              'label': lawn_rain_label,
              'icon': 'mdi:water',
              'severity': 'blue' if in_lawn_rain_season else 'green',
              'promoted': false,
              'sort_key': '2_lawn_rain'
            }
          ] %}

          {% set soil_moisture = states('sensor.soil_moisture_sensor_moisture')
             | float(-1) %}
          {% set soil_threshold = states('input_number.soil_moisture_minimum')
             | float(25) %}
          {% set soil_low = soil_moisture >= 0 and soil_moisture <= soil_threshold %}
          {% set soil_label = 'Soil Moisture: ' ~ (soil_moisture | round(0) | int)
             ~ '% (min ' ~ (soil_threshold | round(0) | int) ~ '%)' %}
          {% set ns.items = ns.items + [
            {
              'id': 'soil_moisture',
              'active': soil_low,
              'label': soil_label,
              'icon': 'mdi:water-percent',
              'severity': 'red' if soil_low else 'green',
              'promoted': soil_low,
              'sort_key': '0_soil_moisture'
            }
          ] %}

          {# --- Batteries: loop for all battery-monitored devices --- #}
          {% set battery_configs = [
            {
              'entity': 'sensor.<entity_3>_s_door_battery',
              'id': 'battery_<entity_3>_door',
              'label': "<entity_3>'s Door Battery",
              'sort_key': '0_battery_<entity_3>_door'
            },
            {
              'entity':
                'sensor.<entity_4>s_door_battery',
              'id': 'battery_<entity_4>_door',
              'label': "<entity_4>'s Door Battery",
              'sort_key': '0_battery_<entity_4>_door'
            },
            {
              'entity':
                'sensor.basement_area_basement_door_battery',
              'id': 'battery_basement_door',
              'label': 'Basement Door Battery',
              'sort_key': '0_battery_basement_door'
            },
            {
              'entity':
                'sensor.garage_house_garage_door_battery',
              'id': 'battery_garage_door',
              'label': 'Garage Door Battery',
              'sort_key': '0_battery_garage_door'
            },
            {
              'entity': 'sensor.soil_moisture_sensor_battery',
              'id': 'soil_battery',
              'label': 'Soil Sensor Battery',
              'sort_key': '0_soil_battery'
            }
          ] %}
          {% for battery in battery_configs %}
            {% set level = states(battery.entity)
               | float(-1) %}
            {% set is_low = level >= 0 and level <= 10 %}
            {% set ns.items = ns.items + [
              {
                'id': battery.id,
                'active': is_low,
                'label': battery.label ~ ': '
                   ~ (level | round(0) | int) ~ '%',
                'icon': 'mdi:battery-low',
                'severity': 'red' if is_low else 'green',
                'promoted': is_low,
                'sort_key': battery.sort_key
              }
            ] %}
          {% endfor %}

          {% if is_state('binary_sensor.<entity_34>_cleaning', 'on') %}
            {% set prog = states('sensor.<entity_34>_cleaning_progress')
               | float(0) | round(0) | int %}
            {% set ns.items = ns.items + [
              {
                'id': 'vacuum_<entity_34>',
                'active': true,
                'label': '<entity_34>',
                'icon': 'mdi:robot-vacuum',
                'severity': 'amber',
                'promoted': false,
                'sort_key': '1_vacuum_<entity_34>',
                'progress': prog
              }
            ] %}
          {% else %}
            {% set ns.items = ns.items + [
              {
                'id': 'vacuum_<entity_34>',
                'active': false,
                'label': '<entity_34>',
                'icon': 'mdi:robot-vacuum',
                'severity': 'green',
                'promoted': false,
                'sort_key': '1_vacuum_<entity_34>'
              }
            ] %}
          {% endif %}

          {% if is_state('binary_sensor.<entity_35>_cleaning', 'on') %}
            {% set prog = states('sensor.<entity_35>_cleaning_progress')
               | float(0) | round(0) | int %}
            {% set ns.items = ns.items + [
              {
                'id': 'vacuum_<entity_35>',
                'active': true,
                'label': '<entity_35>',
                'icon': 'mdi:robot-vacuum',
                'severity': 'amber',
                'promoted': false,
                'sort_key': '1_vacuum_<entity_35>',
                'progress': prog
              }
            ] %}
          {% else %}
            {% set ns.items = ns.items + [
              {
                'id': 'vacuum_<entity_35>',
                'active': false,
                'label': '<entity_35>',
                'icon': 'mdi:robot-vacuum',
                'severity': 'green',
                'promoted': false,
                'sort_key': '1_vacuum_<entity_35>'
              }
            ] %}
          {% endif %}

          {% set utility = label_entities('utility_light') %}
          {% set light_count = states.light
             | selectattr('state', 'eq', 'on')
             | rejectattr('entity_id', 'in', utility)
             | list | length %}
          {% set ns.items = ns.items + [
            {
              'id': 'lights',
              'active': light_count > 0,
              'label': light_count ~ ' Light' ~ ('s' if light_count != 1 else '') ~ ' On',
              'icon': 'mdi:lightbulb-group',
              'severity': 'blue' if light_count > 0 else 'green',
              'promoted': false,
              'sort_key': '2_lights'
            }
          ] %}

          {% set printer_1_status = states('sensor.<entity_23>_current_status') %}
          {% if printer_1_status == 'printing' %}
            {% set prog = states('sensor.<entity_23>_percent_complete')
               | float(0) | round(0) | int %}
            {% set raw_min = states('sensor.<entity_23>_remaining_print_time')
               | float(0) %}
            {% set hrs = (raw_min / 60) | int %}
            {% set mins = (raw_min % 60) | int %}
            {% set tr = (hrs ~ 'h ' ~ mins ~ 'm left')
               if hrs > 0 else (mins ~ 'm left') %}
            {% set ns.items = ns.items + [
              {
                'id': 'printer_<entity_20>',
                'active': true,
                'label': '<entity_20> 3D Printer',
                'icon': 'mdi:printer-3d',
                'severity': 'green',
                'promoted': false,
                'sort_key': '3_printer_<entity_20>',
                'progress': prog,
                'time_remaining': tr
              }
            ] %}
          {% else %}
            {% set ns.items = ns.items + [
              {
                'id': 'printer_<entity_20>',
                'active': false,
                'label': '<entity_20> 3D Printer — '
                   ~ (printer_1_status | default('idle') | title),
                'icon': 'mdi:printer-3d',
                'severity': 'green',
                'promoted': false,
                'sort_key': '3_printer_<entity_20>'
              }
            ] %}
          {% endif %}

          {% set printer_2_status = states('sensor.<entity_22>_current_status') %}
          {% if printer_2_status == 'printing' %}
            {% set prog = states('sensor.<entity_22>_percent_complete')
               | float(0) | round(0) | int %}
            {% set raw_min = states('sensor.<entity_22>_remaining_print_time')
               | float(0) %}
            {% set hrs = (raw_min / 60) | int %}
            {% set mins = (raw_min % 60) | int %}
            {% set tr = (hrs ~ 'h ' ~ mins ~ 'm left')
               if hrs > 0 else (mins ~ 'm left') %}
            {% set ns.items = ns.items + [
              {
                'id': 'printer_<entity_21>',
                'active': true,
                'label': '<entity_21> 3D Printer',
                'icon': 'mdi:printer-3d',
                'severity': 'green',
                'promoted': false,
                'sort_key': '3_printer_<entity_21>',
                'progress': prog,
                'time_remaining': tr
              }
            ] %}
          {% else %}
            {% set ns.items = ns.items + [
              {
                'id': 'printer_<entity_21>',
                'active': false,
                'label': '<entity_21> 3D Printer — '
                   ~ (printer_2_status | default('idle') | title),
                'icon': 'mdi:printer-3d',
                'severity': 'green',
                'promoted': false,
                'sort_key': '3_printer_<entity_21>'
              }
            ] %}
          {% endif %}

          {% set hvac_action = state_attr('climate.living_room_thermostat', 'hvac_action') %}
          {% set ns.items = ns.items + [
            {
              'id': 'hvac',
              'active': hvac_action in ['heating', 'cooling'],
              'label': hvac_action | default('idle') | title,
              'icon': 'mdi:thermostat',
              'severity': 'green',
              'promoted': false,
              'sort_key': '3_hvac'
            }
          ] %}

          {% set power = states('sensor.<entity_33>_power_top') | float(0) %}
          {% set ns.items = ns.items + [
            {
              'id': 'power',
              'active': power > 0,
              'label': (power | round(0) | int | string) ~ 'W',
              'icon': 'mdi:flash',
              'severity': 'green',
              'promoted': false,
              'sort_key': '3_power'
            }
          ] %}

          {{ ns.items | sort(attribute='sort_key') }}
  sensor:
    - name: "Dashboard Notifications"
      unique_id: dashboard_notifications
      icon: mdi:bell
      state: >
        {{ notification_items | selectattr('active') | list | length }}
      attributes:
        items: >
          {{ notification_items }}

# =============================================================================
# House Armed Card Visibility
# =============================================================================
# True when the house is armed OR during the bedtime window, so the
# arming card shows in both situations. Used as the gate condition for
# the conditional card in dashboard.yaml.

- trigger:
    - platform: state
      entity_id:
        - input_boolean.house_armed
        - schedule.cond_bedtime_doors
    - platform: homeassistant
      event: start
  binary_sensor:
    - name: "House Armed Card Visible"
      unique_id: house_armed_card_visible
      icon: mdi:shield-home
      state: >
        {{ is_state('input_boolean.house_armed', 'on')
           or is_state('schedule.cond_bedtime_doors', 'on') }}
